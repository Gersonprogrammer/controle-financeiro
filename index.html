<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltrack | Sua vida financeira sob controle<</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">
        <h1>💰 Caltrack</h1>
        <p>Sua vida financeira sob controle</p>
    </div>
</header>

<div class="container">

    <aside>
        <nav>
            <ul>
                <li>Dashboard</li>
                <li>Transações</li>
                <li>Metas</li>
                <li>Relatórios</li>
                <li>Configurações</li>
            </ul>
        </nav>
    </aside>
<main>

   <section class="cards">
<div class="card saldo">
    <i data-lucide="wallet"></i>
    <h3>Saldo Total</h3>
    <p id="saldo-total">R$ 0,00</p>
</div>

<div class="card receita">
    <i data-lucide="trending-up"></i>
    <h3>Receitas</h3>
    <p id="total-receitas">R$ 0,00</p>
</div>

<div class="card despesa">
    <i data-lucide="trending-down"></i>
    <h3>Despesas</h3>
    <p id="total-despesas">R$ 0,00</p>
</div>

</section>

<section class="grafico">

    <div class="grafico-header">
        <h3>Resumo Financeiro</h3>
    </div>

   <div class="grafico-placeholder">

    <canvas id="graficoFinanceiro"></canvas>

</div>

</section>

<section class="transacoes">

   <div class="transacoes-header">

    <h3>Últimas Transações</h3>

  <input
    type="text"
    id="campo-pesquisa"
    placeholder="Pesquisar...">

<select id="filtro-categoria">
    <option value="">Todas</option>
    <option value="Alimentação">Alimentação</option>
    <option value="Moradia">Moradia</option>
    <option value="Transporte">Transporte</option>
    <option value="Lazer">Lazer</option>
    <option value="Saúde">Saúde</option>
    <option value="Educação">Educação</option>
    <option value="Trabalho">Trabalho</option>
    <option value="Outros">Outros</option>
</select>

<select id="filtro-tipo">
    <option value="">Todos</option>
    <option value="receita">Receita</option>
    <option value="despesa">Despesa</option>
</select>

<select id="ordenacao">
    <option value="">Ordenar por</option>
    <option value="data-desc">Mais recentes</option>
    <option value="data-asc">Mais antigas</option>
    <option value="valor-desc">Maior valor</option>
    <option value="valor-asc">Menor valor</option>
</select>

<button class="btn-nova">
        + Nova Transação
    </button>

    <button id="btn-exportar" class="btn-exportar">
    Exportar CSV
</button>

</div>

    <table>

        <thead>

          <tr>
    <th>Data</th>
    <th>Descrição</th>
    <th>Categoria</th>
    <th>Tipo</th>
    <th>Valor</th>
    <th>Ações</th>
</tr>

        </thead>

   <tbody id="corpo-tabela">

</tbody>

    </table>

</section>

</main>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<!-- Modal Nova Transação -->
<div id="modal" class="modal oculto">

    <div class="modal-conteudo">

         <h2>Nova Transação</h2>

        <form id="form-transacao">
       

        <label>Descrição</label>
        <input id="descricao" type="text" placeholder="Ex.: Supermercado">

        <label>Valor</label>
       <input id="valor" type="number" placeholder="0,00">

       <label>Categoria</label>

<select id="categoria">

    <option value="">Selecione...</option>

    <option>Salário</option>
    <option>Alimentação</option>
    <option>Transporte</option>
    <option>Moradia</option>
    <option>Saúde</option>
    <option>Educação</option>
    <option>Lazer</option>
    <option>Investimentos</option>
    <option>Outros</option>

</select>

        <label>Tipo</label>

      <select id="tipo">
    <option>Receita</option>
    <option>Despesa</option>
</select>

<label>Data</label>

<input
    id="data"
    type="date">

        <div class="acoes-modal">
           <button type="button" class="btn-cancelar">Cancelar</button>

           <button type="submit" class="btn-salvar">Salvar</button>

            </div>

            </form>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
